<div class="home">
  @if (showTutorial()) {
    <section class="tutorial" aria-label="Premiers pas">
      <p><strong>Bienvenue sur Capricio.</strong> Tranchez vite (tirage) ou posément (pour/contre) — 100&nbsp;% hors-ligne.</p>
      <button type="button" (click)="dismissTutorial()">Compris, ne plus afficher</button>
    </section>
  }

  <section aria-labelledby="fast-title">
    <h2 id="fast-title" class="group-title"><span class="group-dot fast" aria-hidden="true"></span>Décision rapide</h2>
    <div class="tiles">
      @for (t of fastTools; track t.id) {
        <app-tool-tile [tool]="t" />
      }
    </div>
  </section>

  <section aria-labelledby="slow-title">
    <h2 id="slow-title" class="group-title"><span class="group-dot slow" aria-hidden="true"></span>Décision réfléchie</h2>
    <div class="tiles">
      @for (t of slowTools; track t.id) {
        <app-tool-tile [tool]="t" />
      }
    </div>
  </section>

  <section aria-labelledby="recent-title">
    <div class="recent-head">
      <h2 id="recent-title" class="group-title">Récentes</h2>
      <div class="recent-actions">
        <a routerLink="/history">Tout l'historique →</a>
        <button
          type="button"
          class="trash-btn"
          (click)="clearHistory()"
          [disabled]="history.recent().length === 0"
          aria-label="Supprimer tout l'historique"
          title="Supprimer tout l'historique"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M2 4h12" />
            <path d="M6.5 4V2.8c0-.4.3-.8.8-.8h1.4c.4 0 .8.4.8.8V4" />
            <path d="M3.5 4l.7 9.2c.1.4.4.8.8.8h6c.4 0 .7-.4.8-.8L12.5 4" />
            <path d="M6.5 7v4M9.5 7v4" />
          </svg>
        </button>
      </div>
    </div>
    <app-recent-list [items]="history.recent().slice(0, 3)" />
  </section>
</div>

@if (showClearConfirm()) {
  <app-confirm-dialog
    title="Supprimer tout l'historique ?"
    message="Toutes les décisions enregistrées seront définitivement effacées."
    confirmLabel="Tout supprimer"
    (confirmed)="confirmClear()"
    (cancelled)="showClearConfirm.set(false)"
  />
}
