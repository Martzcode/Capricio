<header class="titlebar" role="banner" [attr.aria-label]="i18n.t('titlebar.banner')">
  <!-- Zone déplaçable (drag natif Tauri). Les boutons sont hors de cette zone. -->
  <div
    class="titlebar-drag"
    data-tauri-drag-region
    (mousedown)="onDragMouseDown($event)"
  >
    <img class="app-logo" src="assets/logo.png" alt="Capricio" draggable="false" />
    <span class="app-name">Capricio</span>
  </div>

  <div class="titlebar-actions">
    <button
      type="button"
      class="icon-btn"
      (click)="cycleTheme()"
      [attr.aria-label]="themeLabel()"
      [title]="themeLabel()"
    >
      {{ themeIcon() }}
    </button>
    <div class="lang-wrap">
      <button
        type="button"
        class="lang-btn"
        (click)="toggleLangMenu(); $event.stopPropagation()"
        [attr.aria-expanded]="showLangMenu()"
        aria-haspopup="listbox"
        [attr.aria-label]="i18n.t('titlebar.lang', { lang: i18n.lang() })"
        [title]="i18n.t('titlebar.lang', { lang: i18n.lang() })"
      >
        {{ i18n.lang().toUpperCase() }}
        <span class="caret" aria-hidden="true" [class.open]="showLangMenu()">▾</span>
      </button>
      @if (showLangMenu()) {
        <ul class="lang-menu" role="listbox" [attr.aria-label]="i18n.t('titlebar.lang', { lang: i18n.lang() })">
          @for (l of langs; track l.code) {
            <li role="none">
              <button
                type="button"
                role="option"
                [attr.aria-selected]="i18n.lang() === l.code"
                [class.active]="i18n.lang() === l.code"
                (click)="selectLang(l.code); $event.stopPropagation()"
              >
                <span class="code">{{ l.code.toUpperCase() }}</span>
                <span class="name">{{ l.label }}</span>
                @if (i18n.lang() === l.code) {
                  <span class="tick" aria-hidden="true">✓</span>
                }
              </button>
            </li>
          }
        </ul>
      }
    </div>
    <button
      type="button"
      class="icon-btn help"
      (click)="openAbout()"
      [attr.aria-label]="i18n.t('titlebar.about')"
      [title]="i18n.t('titlebar.about')"
    >
      ?
    </button>

    @if (win.isTauri) {
      <div class="window-controls" role="group" aria-label="Contrôles de la fenêtre">
        <button type="button" class="icon-btn" (click)="win.minimize()" [attr.aria-label]="i18n.t('titlebar.minimize')" [title]="i18n.t('titlebar.minimizeTitle')">─</button>
        <button
          type="button"
          class="icon-btn"
          (click)="win.toggleMaximize()"
          [attr.aria-label]="win.isMaximized() ? i18n.t('titlebar.restore') : i18n.t('titlebar.maximize')"
          [title]="win.isMaximized() ? i18n.t('titlebar.restoreTitle') : i18n.t('titlebar.maximizeTitle')"
        >
          {{ win.isMaximized() ? "❐" : "▢" }}
        </button>
        <button type="button" class="icon-btn close" (click)="win.closeWindow()" [attr.aria-label]="i18n.t('titlebar.close')" [title]="i18n.t('titlebar.closeTitle')">✕</button>
      </div>
    }
  </div>
</header>

@if (showAbout()) {
  <div class="about-backdrop" (click)="closeAbout()">
    <section class="about" role="dialog" aria-modal="true" aria-labelledby="about-title" (click)="$event.stopPropagation()">
      <img class="about-logo" src="assets/logo.png" alt="" draggable="false" />
      <h2 id="about-title">Capricio <span class="version">{{ appVersion }}</span></h2>
      <p>{{ i18n.t("titlebar.aboutP1") }}</p>
      <button type="button" class="link-row" (click)="openExternal(repoUrl)">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" /></svg>
        <span>{{ i18n.t("titlebar.repo") }}</span>
        <span class="ext" aria-hidden="true">↗</span>
      </button>
      <p class="muted credit">{{ i18n.t("titlebar.devBy") }} <button type="button" class="link" (click)="openExternal(authorUrl)">Martzcode</button></p>
      <button type="button" class="btn-primary" (click)="closeAbout()" [attr.aria-label]="i18n.t('common.close')">{{ i18n.t("common.close") }}</button>
    </section>
  </div>
}
