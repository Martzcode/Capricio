<div class="confirm-backdrop" (click)="cancelled.emit()">
  <section
    class="confirm"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    (click)="$event.stopPropagation()"
  >
    <h2>{{ title() }}</h2>
    <p>{{ message() }}</p>
    <div class="confirm-actions">
      <button type="button" class="btn-ghost" (click)="cancelled.emit()" aria-label="Annuler (Échap)">
        {{ cancelLabel() }}
      </button>
      <button type="button" class="btn-primary" (click)="confirmed.emit()" autofocus>
        {{ confirmLabel() }}
      </button>
    </div>
  </section>
</div>
