<div class="coin-page">
  <div class="top-bar">
    <a class="home-btn" routerLink="/" [attr.aria-label]="i18n.t('common.home')" [title]="i18n.t('common.home')">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 10.5V20h13v-9.5" /><path d="M10 20v-5h4v5" /></svg>
    </a>
  </div>
  <h1>{{ i18n.t("tools.coin") }}</h1>

  <form class="labels" (submit)="$event.preventDefault(); flip()">
    <label>
      {{ i18n.t("coin.side1") }}
      <input
        type="text"
        maxlength="20"
        [value]="labelA()"
        (input)="setLabel(0, $any($event.target).value)"
        [attr.aria-label]="i18n.t('coin.side1')"
      />
    </label>
    <label>
      {{ i18n.t("coin.side2") }}
      <input
        type="text"
        maxlength="20"
        [value]="labelB()"
        (input)="setLabel(1, $any($event.target).value)"
        [attr.aria-label]="i18n.t('coin.side2')"
      />
    </label>
  </form>

  <div class="stage" aria-live="polite" aria-atomic="true">
    <div
      class="piece"
      [class.spinning]="flipping()"
      [class.landed]="result() && !flipping()"
    >
      <div class="flip" aria-hidden="true" [class.show-back]="showBack()">
        <div class="face front">
          <img src="assets/logo.png" alt="" draggable="false" />
        </div>
        <div class="face back">
          <span class="coin-name">Capricio</span>
        </div>
      </div>
    </div>
    @if (flipping()) {
      <p class="hint">{{ i18n.t("coin.spinning") }}</p>
    } @else if (result()) {
      <p class="winner">{{ result()?.winner }}</p>
    } @else {
      <p class="hint">{{ i18n.t("coin.hint") }}</p>
    }
  </div>

  <div class="actions">
    <button type="button" class="btn-primary" (click)="flip()" [disabled]="flipping()">
      {{ result() ? i18n.t("coin.replay") : i18n.t("coin.launch") }}
    </button>
  </div>
</div>
