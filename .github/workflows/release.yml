# Release Capricio — continue sur `main` (chaque commit direct ou PR mergée
# déclenche une release), version YYYY.MM.xx (xx repart de 01 à chaque mois).
# Changelog : manuel (CHANGELOG.md, écrit par l'équipe à chaque release).
#
#Tolérance aux échecs : la version n'est commitée/taguée/publiée que si TOUS
# les builds réussissent — un run rouge ne consomme aucun numéro.
# Anti-boucle : le commit de version porte `[skip ci]`, runs sérialisés.
#
# Note semver : Tauri/Cargo exigent du semver strict (pas de zéros initiaux) ;
# les fichiers techniques reçoivent la forme normalisée (2026.10.2) tandis que
# tag, release et À propos gardent l'affichage demandé (2026.10.02).
#
# Artefacts :
# - .dmg ×2 (ARM+Intel), .exe (NSIS, installation directe hors Store),
#   .deb, .rpm, .AppImage (Arch/Manjaro, portable).
# - .msix (Microsoft Store UNIQUEMENT, Desktop Bridge via scripts/pack-msix.ps1
#   + MakeAppx du Windows SDK — même approche que Vivum).
#   Non signé par défaut : Partner Center re-signe à la soumission.
#   Signature PFX optionnelle en CI (sideload) via secrets MSIX_SIGN_*.
# - Pas de .msi : WiX limite chaque composante à 255 (2026 refusé) et le schéma
#   de version publié 2026.MM.xx est déjà figé — l'.exe NSIS couvre Windows en
#   direct. Ni l'.exe ni un éventuel .msi ne vont au Store : seul le .msix y va.
# Secrets MSIX/Store (optionnels, repli = compte Partner Center Martzcode) :
#   MS_STORE_IDENTITY_NAME, MS_STORE_PUBLISHER, MS_STORE_PUBLISHER_DISPLAY,
#   MSIX_SIGN_PFX_BASE64, MSIX_SIGN_PASSWORD.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      semver: ${{ steps.calc.outputs.semver }}
      version-msix: ${{ steps.calc.outputs.version_msix }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: calc
        name: Calculer le prochain YYYY.MM.xx (sans rien écrire)
        run: |
          set -euo pipefail
          PREFIX=$(date -u +%Y.%m)
          LAST=$(git tag --list "v$PREFIX.*" | sort -V | tail -n 1 || true)
          if [ -z "$LAST" ]; then
            NEXT="01"
          else
            N="${LAST##*.}"
            NEXT=$(printf "%02d" $((10#$N + 1)))
          fi
          VERSION="$PREFIX.$NEXT"
          SEMVER="$(echo "$VERSION" | awk -F. '{print $1+0 "." $2+0 "." $3+0}')"
          # MSIX (Microsoft Store) : 4 parties numériques, chacune <= 65535.
          # YYYY.MM.xx -> YYYY.M.xx.0 (monotone, même convention que Vivum).
          MSIX="$(echo "$VERSION" | awk -F. '{print $1+0 "." $2+0 "." $3+0 ".0"}')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "version_msix=$MSIX" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release candidate v$VERSION (semver $SEMVER, msix $MSIX)"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: dmg
          - platform: macos-15-intel
            bundles: dmg
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Tamponner la version (local, non committé)
        run: bash .github/scripts/stamp-version.sh "${{ needs.version.outputs.version }}" "${{ needs.version.outputs.semver }}"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        with:
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          args: --bundles ${{ matrix.bundles }}

      - name: Préparer le certificat de signature MSIX (optionnel)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if ($env:MSIX_PFX_B64) {
            $bytes = [Convert]::FromBase64String($env:MSIX_PFX_B64)
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\msix-sign.pfx", $bytes)
            "MSIX_SIGN_PFX_PATH=$env:RUNNER_TEMP\msix-sign.pfx" >> $env:GITHUB_ENV
          } else {
            Write-Host "Pas de certificat : le MSIX restera non signé (Partner Center re-signe à la soumission)."
          }
        env:
          MSIX_PFX_B64: ${{ secrets.MSIX_SIGN_PFX_BASE64 }}

      # MSIX Desktop Bridge (Microsoft Store UNIQUEMENT) : non signé par défaut.
      # Identité/publisher via secrets, repli = valeurs Partner Center (Martzcode).
      # L'.exe NSIS reste l'installeur direct hors Store — il ne va PAS au Store.
      - name: Empaqueter le MSIX (Microsoft Store uniquement)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/pack-msix.ps1 -DisplayName "Capricio" -PublisherDisplayName "${{ secrets.MS_STORE_PUBLISHER_DISPLAY || 'Martzcode' }}"
        env:
          MSIX_IDENTITY_NAME: ${{ secrets.MS_STORE_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ secrets.MS_STORE_PUBLISHER }}
          MSIX_VERSION: ${{ needs.version.outputs.version-msix }}
          MSIX_SIGN_PASSWORD: ${{ secrets.MSIX_SIGN_PASSWORD }}

      - name: Téléverser le MSIX (artefact de workflow)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: src-tauri/target/release/bundle/msix/*.msix
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Tamponner, committer, taguer
        run: |
          set -euo pipefail
          bash .github/scripts/stamp-version.sh "${{ needs.version.outputs.version }}" "${{ needs.version.outputs.semver }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock src/app/version.ts
          git commit -m "release ${{ needs.version.outputs.tag }} [skip ci]"
          git tag "${{ needs.version.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ needs.version.outputs.tag }}"

      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist-bundles
          merge-multiple: true

      - name: Créer la GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find dist-bundles -type f | sort)
          BODY="Capricio ${{ needs.version.outputs.version }} — application d'aide à la décision (100 % hors-ligne).

          Détails dans CHANGELOG.md.

          - macOS (Apple Silicon / Intel) : .dmg
          - Windows (installation directe, hors Store) : .exe (NSIS)
          - Microsoft Store (UNIQUEMENT) : .msix version ${{ needs.version.outputs.version-msix }}, non signé — à déposer dans Partner Center (le Store re-signe automatiquement). Ni l'.exe ni un .msi ne vont au Store.
          - Debian/Ubuntu : .deb — Fedora : .rpm
          - Arch/Manjaro : .AppImage (rendre exécutable : chmod +x)"
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "Capricio ${{ needs.version.outputs.version }}" \
            --notes "$BODY" \
            "${FILES[@]}"
