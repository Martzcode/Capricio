<header class="titlebar" role="banner" aria-label="Barre de titre Capricio">
  <!-- Zone déplaçable (drag natif Tauri). Les boutons sont hors de cette zone. -->
  <div
    class="titlebar-drag"
    data-tauri-drag-region
    (mousedown)="onDragMouseDown($event)"
  >
    <span class="app-name">Capricio</span>
  </div>

  <div class="titlebar-actions">
    <button
      type="button"
      class="icon-btn"
      (click)="cycleTheme()"
      [attr.aria-label]="themeLabel()"
      [title]="themeLabel()"
    >
      {{ themeIcon() }}
    </button>
    <button
      type="button"
      class="icon-btn help"
      (click)="openAbout()"
      aria-label="À propos de Capricio"
      title="À propos de Capricio"
    >
      ?
    </button>

    @if (win.isTauri) {
      <div class="window-controls" role="group" aria-label="Contrôles de la fenêtre">
        <button type="button" class="icon-btn" (click)="win.minimize()" aria-label="Réduire la fenêtre" title="Réduire">─</button>
        <button
          type="button"
          class="icon-btn"
          (click)="win.toggleMaximize()"
          [attr.aria-label]="win.isMaximized() ? 'Restaurer la fenêtre' : 'Agrandir la fenêtre'"
          [title]="win.isMaximized() ? 'Restaurer' : 'Agrandir'"
        >
          {{ win.isMaximized() ? "❐" : "▢" }}
        </button>
        <button type="button" class="icon-btn close" (click)="win.closeWindow()" aria-label="Fermer l'application" title="Fermer">✕</button>
      </div>
    }
  </div>
</header>

@if (showAbout()) {
  <div class="about-backdrop" (click)="closeAbout()">
    <section class="about" role="dialog" aria-modal="true" aria-labelledby="about-title" (click)="$event.stopPropagation()">
      <h2 id="about-title">Capricio {{ appVersion }}</h2>
      <p>Application d'aide à la décision — 100&nbsp;% hors-ligne, données locales.</p>
      <p class="muted">Décision rapide ou réfléchie, sans compte ni réseau (CDC §1).</p>
      <button type="button" class="btn-primary" (click)="closeAbout()" aria-label="Fermer la fenêtre À propos (Échap)">Fermer</button>
    </section>
  </div>
}
